name: Publish v2.1.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v2.1.2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release with installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.1.2 zhihuishu-assistant-v2.1.2.zip \
            --title "智慧树助手一体版 2.1.2" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --latest

